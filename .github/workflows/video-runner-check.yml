name: Caption-Safe Private Jets Render
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          ffmpeg -version | head -n 2
      - name: Restore deterministic renderer
        shell: bash
        run: |
          cat > /tmp/render.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/render.py.gz.b64 | gunzip > render_caption_safe.py
          python -m py_compile render_caption_safe.py
      - name: Download locked source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/raw
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          get() { curl -fL --retry 5 --retry-all-errors --connect-timeout 20 -A "$UA" "$1" -o "$2"; }
          get 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/aa5c84cf-5b78-435e-850f-633499642f4b.mp3' media/narration1.mp3
          get 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/27b44c63-f08a-42a7-b594-f02b13c8274d.mp3' media/narration2.mp3
          get 'https://videos.pexels.com/video-files/34746862/14730107_2546_1440_30fps.mp4' media/raw/private_dusk.mp4
          get 'https://videos.pexels.com/video-files/36330055/15408092_2160_3840_30fps.mp4' media/raw/airliner_vertical.mp4
          get 'https://videos.pexels.com/video-files/13278455/13278455-uhd_3840_2160_30fps.mp4' media/raw/private_prague.mp4
          get 'https://videos.pexels.com/video-files/14109774/14109774-uhd_3840_2160_60fps.mp4' media/raw/private_aerial.mp4
          get 'https://videos.pexels.com/video-files/32538633/13876757_3840_2160_60fps.mp4' media/raw/widebody.mp4
          get 'https://videos.pexels.com/video-files/34171733/14486284_1920_1080_30fps.mp4' media/raw/commercial.mp4
          get 'https://cms.grndcntrl.net/uploads/large_N8628_4cdb390bc6.jpg' media/N8628.jpg
          get 'https://cdn.jetphotos.com/full/6/2089568_1748776495.jpg' media/N11AF.jpg
          get 'https://i.ytimg.com/vi/2GdTP26Cij8/maxresdefault.jpg' media/VT-AKV.jpg
          get 'https://upload.wikimedia.org/wikipedia/commons/6/6c/Roman_Abramovich%27s_B787-8_Dreamliner_P4-BDL_%28Sideview%29.jpg' media/P4-BDL.jpg
          get 'https://upload.wikimedia.org/wikipedia/commons/9/95/Airbus_A340-300_Bourkhan_Group_F-WWJM_-_MSN_955_-_Will_be_M-ABUS_-_Now_in_Global_Jet_Luxembourg_fleet_as_M-IABU_%282950340362%29.jpg' media/M-IABU.jpg
          for src in media/raw/*.mp4; do
            dst="media/$(basename "$src")"
            ffmpeg -hide_banner -loglevel warning -y -i "$src" -vf "scale='if(gt(iw,ih),1920,-2)':'if(gt(iw,ih),-2,1920)',fps=30" -an -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -movflags +faststart "$dst"
          done
          rm -rf media/raw
          ls -lh media
      - name: Render and run caption-boundary QC
        run: python render_caption_safe.py
      - name: Upload corrected video package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billionaire-private-jets-v5-caption-safe-final
          path: |
            output/**
            work/caption-qc/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
