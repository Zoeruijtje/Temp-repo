name: Caption-Safe Private Jets Render

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install pillow
      - name: Restore renderer
        run: |
          cat renderer/renderer.b64.part* | base64 -d | gunzip > render_caption_safe.py
          python -m py_compile render_caption_safe.py
      - name: Download and normalize sources
        run: bash renderer/download_sources.sh
      - name: Render and run caption-boundary QC
        run: python render_caption_safe.py
      - name: Upload corrected video package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billionaire-private-jets-v5-caption-safe-final
          path: |
            output/**
            work/caption-qc/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
